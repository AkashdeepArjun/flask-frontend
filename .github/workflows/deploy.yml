name: Deploy React to public_html

on:
  push:
    branches: [ main ]  # Change to your main branch name if different

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the code using v4 actions (bypasses Node deprecation)
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js v22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Install dependencies and compile React app
      - name: Build React App
        run: |
          npm install
          npm run build

      # 4. Sync compiled /dist output to public_html/
      - name: Deploy to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_USERPASSWORD }}
          local-dir: ./dist/                  # If using Create React App, change to ./build/
          server-dir: ./public_html/